<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女神診断 ─ 魂の進化サイクル</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500&display=swap');

:root {
  --bg: #08070f;
  --surface: rgba(255,255,255,0.03);
  --border: rgba(255,255,255,0.08);
  --border-gold: rgba(196,160,80,0.3);
  --gold: #c4a050;
  --gold-bright: #e8c97a;
  --gold-dim: #6b5520;
  --silver: #a8b8c8;
  --text: #e8e0d4;
  --text-dim: #8090a0;
  --crimson: #6b1a28;
  --phase1: rgba(196,160,80,0.7);
  --phase2: rgba(100,190,160,0.7);
  --phase3: rgba(220,140,80,0.7);
  --phase4: rgba(170,110,200,0.7);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

#bg-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* HEADER */
.site-header {
  text-align: center;
  padding: 80px 0 60px;
}

.site-header .en {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  letter-spacing: 0.5em;
  color: var(--gold-dim);
  margin-bottom: 20px;
  display: block;
}

.site-header h1 {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 900;
  color: var(--gold);
  letter-spacing: 0.15em;
  line-height: 1.2;
  text-shadow: 0 0 60px rgba(196,160,80,0.3);
}

.site-header .tagline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px;
  color: var(--silver);
  margin-top: 16px;
  letter-spacing: 0.2em;
}

.header-line {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--gold-dim), transparent);
  margin: 30px auto 0;
}

/* PANEL */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 1px solid var(--border-gold);
  padding: 36px 32px;
  margin-bottom: 20px;
  position: relative;
}

@media (max-width: 480px) {
  .panel { padding: 24px 20px; }
}

.panel-title {
  font-family: 'Zen Old Mincho', serif;
  font-size: 16px;
  color: var(--gold);
  letter-spacing: 0.2em;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.step-no {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--bg);
  background: var(--gold-dim);
  padding: 3px 12px;
}

/* FORM */
.field {
  margin-bottom: 20px;
}

.field label {
  display: block;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.field input, .field select {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-bottom: 1px solid var(--border-gold);
  color: var(--text);
  padding: 12px 16px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  outline: none;
  -webkit-appearance: none;
  border-radius: 0;
  transition: border-color 0.3s;
}

.field input:focus, .field select:focus {
  border-color: var(--gold-dim);
  background: rgba(196,160,80,0.04);
}

.field select option {
  background: #1a1520;
}

.field-note {
  font-size: 11px;
  color: var(--gold-dim);
  margin-top: 6px;
  letter-spacing: 0.05em;
  line-height: 1.6;
}

/* BUTTON */
.btn {
  background: var(--gold-dim);
  color: var(--text);
  border: 1px solid var(--border-gold);
  padding: 14px 32px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  letter-spacing: 0.2em;
  cursor: pointer;
  transition: all 0.3s;
  display: inline-block;
  text-align: center;
}

.btn:hover {
  background: var(--gold);
  color: var(--bg);
  box-shadow: 0 0 20px rgba(196,160,80,0.4);
}

.btn-row {
  display: flex;
  gap: 16px;
  margin-top: 24px;
  flex-wrap: wrap;
}

.btn-row .btn {
  flex: 1;
  min-width: 140px;
}

/* RESULT CARD */
.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 2px solid var(--gold);
  padding: 32px;
  margin-bottom: 24px;
  page-break-inside: avoid;
}

@media (max-width: 480px) {
  .result-card { padding: 20px; }
}

.result-card .goddess-name {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(24px, 5vw, 36px);
  color: var(--gold);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.result-card .sign-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 0.3em;
  margin-bottom: 20px;
}

.result-card .theme {
  font-size: 13px;
  color: var(--silver);
  line-height: 1.8;
  margin-bottom: 24px;
}

.result-card .whisper {
  background: rgba(100,190,160,0.15);
  border-left: 3px solid rgba(100,190,160,0.5);
  padding: 16px;
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
  margin: 20px 0;
  font-style: italic;
}

/* EVOLUTION PATH */
.evolution-paths {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 24px 0;
}

@media (max-width: 480px) {
  .evolution-paths { grid-template-columns: 1fr; }
}

.evolution-box {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  padding: 16px;
  font-size: 12px;
  line-height: 1.7;
}

.evolution-box.light {
  border-left: 3px solid var(--phase2);
}

.evolution-box.dark {
  border-left: 3px solid var(--crimson);
}

.evolution-box h4 {
  font-size: 11px;
  letter-spacing: 0.2em;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.evolution-box.light h4 {
  color: var(--phase2);
}

.evolution-box.dark h4 {
  color: var(--crimson);
}

/* MYTH TAB */
.myth-tab-row {
  display: flex;
  gap: 8px;
  margin: 24px 0 16px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.myth-tab {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 8px 16px;
  font-size: 12px;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.3s;
  border-bottom: 2px solid transparent;
}

.myth-tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

.myth-panel {
  display: none;
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-dim);
  page-break-inside: avoid;
}

.myth-panel.active {
  display: block;
}

/* PREMIUM CONTENT */
.premium-section {
  background: rgba(196,160,80,0.08);
  border: 1px solid var(--border-gold);
  padding: 24px;
  margin: 24px 0;
  page-break-inside: avoid;
}

.premium-label {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--gold-dim);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.premium-section h3 {
  font-family: 'Zen Old Mincho', serif;
  font-size: 16px;
  color: var(--gold);
  letter-spacing: 0.1em;
  margin-bottom: 16px;
}

.premium-section p {
  font-size: 13px;
  line-height: 1.8;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.work-item {
  background: rgba(255,255,255,0.02);
  border-left: 3px solid var(--gold-dim);
  padding: 12px;
  margin: 12px 0;
  font-size: 12px;
  line-height: 1.7;
}

/* STRIPE PANEL */
.stripe-panel {
  background: linear-gradient(135deg, rgba(196,160,80,0.1), rgba(100,190,160,0.05));
  border: 1px solid var(--border-gold);
  padding: 32px;
  margin: 40px 0;
  text-align: center;
}

.stripe-panel h3 {
  font-family: 'Zen Old Mincho', serif;
  font-size: 18px;
  color: var(--gold);
  letter-spacing: 0.1em;
  margin-bottom: 12px;
}

.stripe-panel p {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.8;
  margin-bottom: 24px;
}

.stripe-panel .price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  color: var(--gold-bright);
  margin: 16px 0;
  letter-spacing: 0.1em;
}

.btn-buy, .btn-dl-premium, .btn-dl-free {
  background: var(--gold-dim);
  color: var(--text);
  border: 1px solid var(--border-gold);
  padding: 14px 32px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  letter-spacing: 0.2em;
  cursor: pointer;
  transition: all 0.3s;
  display: inline-block;
  text-align: center;
  text-decoration: none;
}

.btn-buy:hover, .btn-dl-premium:hover, .btn-dl-free:hover {
  background: var(--gold);
  color: var(--bg);
  box-shadow: 0 0 20px rgba(196,160,80,0.4);
}

/* REMINDER BANNER */
.remind-banner {
  background: rgba(220,140,80,0.15);
  border: 1px solid rgba(220,140,80,0.5);
  border-left: 3px solid var(--phase3);
  padding: 16px;
  margin-bottom: 24px;
  font-size: 13px;
  line-height: 1.6;
}

.remind-banner strong {
  color: var(--phase3);
}

/* CALENDAR CARD */
.cal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 20px;
  margin: 16px 0;
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

.cal-card button {
  background: var(--gold-dim);
  color: var(--text);
  border: 1px solid var(--border-gold);
  padding: 8px 16px;
  font-size: 11px;
  letter-spacing: 0.1em;
  cursor: pointer;
  margin-top: 12px;
  transition: all 0.3s;
}

.cal-card button:hover {
  background: var(--gold);
  color: var(--bg);
}

/* SCREEN SECTIONS */
.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* PRINT STYLES */
@media print {
  body, .wrap { background: white; color: #333; }
  #bg-canvas { display: none; }
  .site-header { padding: 40px 0 30px; page-break-after: avoid; }
  .site-header h1 { color: #333; text-shadow: none; }
  .site-header .en, .site-header .tagline { color: #666; }
  .panel, .result-card { background: white; border: 1px solid #ddd; border-top: 1px solid #ddd; color: #333; }
  .panel-title, .result-card .goddess-name { color: #333; }
  .text-dim, .field-note, .result-card .sign-name, .result-card .theme, .myth-panel { color: #666; }
  .whisper { background: #f5f5f5; border-left: 3px solid #999; color: #666; }
  .evolution-box { background: white; border: 1px solid #ddd; color: #333; }
  .evolution-box.light, .evolution-box.dark { border-left: 3px solid #999; }
  .evolution-box h4 { color: #333; }
  .myth-tab { color: #666; }
  .myth-tab.active { color: #333; border-bottom-color: #333; }
  .myth-tab-row { border-bottom: 1px solid #ddd; }
  .premium-section { background: #f9f9f9; border: 1px solid #ddd; color: #333; }
  .premium-label, .premium-section h3 { color: #333; }
  .premium-section p, .work-item { color: #666; }
  .work-item { background: white; border-left: 3px solid #999; }
  .stripe-panel, .remind-banner, .cal-card, .btn-row { display: none !important; }
  .result-card { margin-bottom: 20px; page-break-inside: avoid; }
  .myth-tab-row { display: none; }
  .myth-panel { display: block !important; }
}

</style>
</head>

  <!-- RESULT SCREEN -->
  <div id="result" class="screen">

</div>

const S = { sunIdx: null, moonIdx: null, answers: [], currentQ: 0 };

// Canvas background
function initCanvas() {
  const c = document.getElementById('bg-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  const drawStars = () => {
    ctx.fillStyle = 'rgba(196,160,80,0.1)';
    for (let i = 0; i < 200; i++) {
      const x = Math.random() * c.width;
      const y = Math.random() * c.height;
      const r = Math.random() * 1.5;
      ctx.fillRect(x, y, r, r);
    }
  };
  drawStars();
  window.addEventListener('resize', () => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    drawStars();
  });
}

function startDiagnosis() {
  const name = document.getElementById('nameInput').value || 'Guest';
  const sun = document.getElementById('sunSignSelect').value;
  const moon = document.getElementById('moonSignSelect').value;
  if (sun === '' || moon === '') {
    alert('星座を選択してください');
    return;
  }
  S.sunIdx = parseInt(sun);
  S.moonIdx = parseInt(moon);
  S.answers = [];
  S.currentQ = 0;
  localStorage.setItem('gd_pending', JSON.stringify({ name, sunIdx: S.sunIdx, moonIdx: S.moonIdx, answers: S.answers }));
  go('questions');
  renderQuestion();
}

function renderQuestion() {
  const qIdx = S.currentQ;
  const questionsArray = ALL_QUESTIONS[S.sunIdx];
  const q = questionsArray[qIdx];

  let html = `<div class="question">
    <p style="font-size: 14px; line-height: 1.8; margin-bottom: 24px; color: var(--text);">${q.text}</p>
    <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;">`;

  for (let i = 1; i <= 5; i++) {
    const isSelected = S.answers[qIdx] === i ? ' style="background: var(--gold-dim); color: var(--bg);"' : '';
    html += `<button class="btn" ${isSelected} onclick="recordAnswer(${i})" style="padding: 12px 8px;">${i}</button>`;
  }

  html += `</div>
    <div style="font-size: 11px; color: var(--text-dim); margin-top: 16px; text-align: center;">1 = 全く当てはまらない ← → 5 = とても当てはまる</div>
  </div>`;

  document.getElementById('questionContent').innerHTML = html;
  document.getElementById('questionProgress').textContent = `Q ${qIdx + 1}/12`;
  document.getElementById('prevBtn').style.display = qIdx > 0 ? 'inline-block' : 'none';
  document.getElementById('nextBtn').textContent = qIdx === 11 ? '診断結果を表示 →' : '次へ →';
}

function recordAnswer(val) {
  S.answers[S.currentQ] = val;
  renderQuestion();
}

function nextQuestion() {
  if (S.answers[S.currentQ] === undefined) {
    alert('回答を選択してください');
    return;
  }
  if (S.currentQ < 11) {
    S.currentQ++;
    renderQuestion();
  } else {
    renderResult();
    go('result');
  }
}

function prevQuestion() {
  if (S.currentQ > 0) {
    S.currentQ--;
    renderQuestion();
  }
}

function showMythTab(idx) {
  const tabs = document.querySelectorAll('.myth-tab');
  const panels = document.querySelectorAll('.myth-panel');
  tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
  panels.forEach((p, i) => p.classList.toggle('active', i === idx));
}

function isPremiumUnlocked() {
  return sessionStorage.getItem('gd_premium') === 'true'
      || localStorage.getItem('gd_premium_session') === String(S.sunIdx);
}

function renderStripePanel() {
  if (isPremiumUnlocked()) {
    return `<div class="stripe-panel">
      <h3>✓ プレミアムコンテンツが有効です</h3>
      <p>女神からの手紙、魂の課題、覚醒の儀式をお楽しみください。</p>
    </div>`;
  }
  return `<div class="stripe-panel">
    <h3>プレミアムコンテンツをアンロック</h3>
    <p>女神からの手紙、魂の課題、覚醒の儀式を含む、より深い診断結果をお読みください。</p>
    <div class="price">¥330</div>
    <button class="btn-buy" onclick="buyPremium()">🔓 プレミアムを購入</button>
    <p style="font-size: 11px; margin-top: 12px; color: var(--text-dim);">Stripe決済 | 安全 & 快速</p>
  </div>`;
}

function buyPremium() {
  const pending = {
    sunIdx: S.sunIdx,
    moonIdx: S.moonIdx,
    answers: S.answers
  };
  localStorage.setItem('gd_pending', JSON.stringify(pending));
  window.location.href = STRIPE_URL + '?client_reference_id=' + encodeURIComponent(JSON.stringify({sunIdx: S.sunIdx}));
}

function checkPaymentReturn() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('gd_paid') !== 'true') return;

  history.replaceState({}, '', window.location.pathname);

  const raw = localStorage.getItem('gd_pending');
  if (!raw) return;

  try {
    const saved = JSON.parse(raw);
    S.sunIdx = saved.sunIdx;
    S.moonIdx = saved.moonIdx;
    S.answers = saved.answers;
    localStorage.removeItem('gd_pending');
    sessionStorage.setItem('gd_premium', 'true');
    localStorage.setItem('gd_premium_session', String(S.sunIdx));
    renderResult();
    go('result');
  } catch (e) {
    console.error('Payment return error:', e);
  }
}

function go(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

window.addEventListener('load', () => {
